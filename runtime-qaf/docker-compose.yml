name: runtime-qaf

# Common settings for the four demo microservices. The resource limits here must
# match `resources` in qaf/config/qaf.yaml.
x-microservice: &microservice
  build: ./services
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 256M

services:
  user:
    <<: *microservice
    environment: { SERVICE: user, PORT: 3001 }
    ports: ["3001:3001"]

  product:
    <<: *microservice
    environment: { SERVICE: product, PORT: 3002 }
    ports: ["3002:3002"]

  order:
    <<: *microservice
    environment:
      SERVICE: order
      PORT: 3003
      USER_URL: http://user:3001
      PRODUCT_URL: http://product:3002
      PAYMENT_URL: http://payment:3004
    ports: ["3003:3003"]

  payment:
    <<: *microservice
    environment: { SERVICE: payment, PORT: 3004 }
    ports: ["3004:3004"]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/qaf-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  # The framework itself: periodically computes the Quality Index and exposes it on :8000
  qaf:
    build: ./qaf
    environment:
      QAF_PROMETHEUS_URL: http://prometheus:9090
    ports: ["8000:8000"]
    depends_on: [prometheus]

  # Load generator, only started on demand:
  #   docker compose run --rm k6 run -e PROFILE=medium /scripts/load.js
  k6:
    image: grafana/k6:0.52.0
    profiles: ["load"]
    volumes:
      - ./load-tests:/scripts
    environment:
      USER_URL: http://user:3001
      PRODUCT_URL: http://product:3002
      ORDER_URL: http://order:3003
